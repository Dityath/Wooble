name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      # Each check runs even when an earlier one fails, so a single push reports every problem.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: lint
        run: bun run lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: format
        run: bun run format:check
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: typecheck
        run: bun run typecheck
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: bun run build
      - name: Summarize code quality
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          bash .github/scripts/report-ci.sh "Code quality" \
            "Install dependencies=$INSTALL_RESULT" \
            "Lint=$LINT_RESULT" \
            "Formatting=$FORMAT_RESULT" \
            "Typecheck=$TYPECHECK_RESULT" \
            "Build=$BUILD_RESULT"

  tests:
    name: Tests
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: architecture
          POSTGRES_PASSWORD: architecture
          POSTGRES_DB: architecture_canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architecture -d architecture_canvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://architecture:architecture@localhost:5432/architecture_canvas
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      # Each suite runs once, with coverage. The last step merges the results and checks the 90% floors.
      - name: Web tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: web
        run: bun run coverage --suite web
      - name: Shared package tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: shared
        run: bun run coverage --suite shared
      - name: Apply database migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: migrate
        run: bun run db:migrate
      - name: API tests
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        id: api
        run: bun run coverage --suite api
      - name: Coverage
        id: coverage
        run: bun run coverage --merge-only --enforce
      - name: Upload coverage report
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/summary.md
            coverage/lcov.info
          if-no-files-found: warn
      - name: Summarize tests
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          WEB_RESULT: ${{ steps.web.outcome }}
          SHARED_RESULT: ${{ steps.shared.outcome }}
          MIGRATE_RESULT: ${{ steps.migrate.outcome }}
          API_RESULT: ${{ steps.api.outcome }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
        run: |
          bash .github/scripts/report-ci.sh "Tests" \
            "Install dependencies=$INSTALL_RESULT" \
            "Web tests=$WEB_RESULT" \
            "Shared package tests=$SHARED_RESULT" \
            "Database migrations=$MIGRATE_RESULT" \
            "API tests=$API_RESULT" \
            "Coverage floors=$COVERAGE_RESULT"

  browser:
    name: Browser journeys
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: architecture
          POSTGRES_PASSWORD: architecture
          POSTGRES_DB: browser_journeys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architecture -d browser_journeys"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      BROWSER_TEST_DATABASE_URL: postgres://architecture:architecture@localhost:5432/browser_journeys
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        if: ${{ steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: echo "version=$(bun --print 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: ${{ steps.install.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        id: chromium
        if: ${{ steps.install.outcome == 'success' }}
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Apply database migrations
        id: migrate
        if: ${{ steps.install.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ env.BROWSER_TEST_DATABASE_URL }}
        run: bun run db:migrate
      - name: Browser journeys
        id: journeys
        if: ${{ steps.chromium.outcome == 'success' && steps.migrate.outcome == 'success' }}
        run: bun run --cwd apps/web test:browser
      - name: Upload Playwright report
        if: ${{ failure() && steps.journeys.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
      - name: Summarize browser journeys
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          CHROMIUM_RESULT: ${{ steps.chromium.outcome }}
          MIGRATE_RESULT: ${{ steps.migrate.outcome }}
          JOURNEYS_RESULT: ${{ steps.journeys.outcome }}
        run: |
          bash .github/scripts/report-ci.sh "Browser journeys" \
            "Install dependencies=$INSTALL_RESULT" \
            "Install Chromium=$CHROMIUM_RESULT" \
            "Database migrations=$MIGRATE_RESULT" \
            "Browser journeys=$JOURNEYS_RESULT"
