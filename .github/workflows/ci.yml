name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: architecture
          POSTGRES_PASSWORD: architecture
          POSTGRES_DB: architecture_canvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U architecture -d architecture_canvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://architecture:architecture@localhost:5432/architecture_canvas
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun test apps/web/tests
      - run: bun run db:migrate
      - run: bun test apps/api/tests
