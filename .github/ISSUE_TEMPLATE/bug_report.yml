name: Bug report
description: Report behavior that does not work as expected.
title: "[Bug] "
labels: [bug, status:needs-triage]
body:
  - type: markdown
    attributes:
      value: Please use fictional data and remove secrets or private URLs from screenshots and logs.
  - type: textarea
    id: problem
    attributes:
      label: What to solve
      description: Describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Include the page or API route and the relevant user role.
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Browser, Bun, Docker or OS versions when relevant; screenshots or sanitized logs.
