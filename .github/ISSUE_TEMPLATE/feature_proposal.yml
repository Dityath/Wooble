name: Feature proposal
description: Suggest a product or experience improvement.
title: "[Feature] "
labels: [enhancement, status:needs-triage]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Proposed user journey
      description: Describe what a person should be able to do, without prescribing the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior would make this complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, examples, screenshots, or constraints.
